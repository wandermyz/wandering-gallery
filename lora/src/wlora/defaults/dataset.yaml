# wandering-lora dataset configuration.
# Paths are relative to this file's directory unless absolute.

subject:
  name: "Siggraph"
  type: "cat"                  # free text, shown to the model
  trigger_word: "siggraph"
  class_tags: ["cat"]          # tags placed right after the trigger word
  # Permanent identity features. They are told to the model as context and, with
  # identity.mode=drop, removed from captions so the trigger word absorbs them.
  features: "white long-haired cat with brown patches on the head, back and tail"

identity:
  mode: drop                   # drop | keep
  # Glob patterns (fnmatch) of tags describing permanent features.
  drop_tags:
    - "* fur"
    - "fur"
    - "fluffy*"
    - "long hair"
    - "long-haired*"
    - "*tabby*"
    - "calico*"
    - "* and white*"
    - "white cat"
    - "brown cat"
    - "orange cat"
    - "* eyes"
    - "*patch*"
    - "white"
    - "brown"
    - "white and *"
    - "*ginger*"
    - "orange and white"
    - "bicolor*"
    - "persian*"
    - "* breed"
  # Exceptions: tags that match drop_tags but describe variable state.
  keep_tags: ["closed eyes", "half-closed eyes", "wet fur"]

caption:
  # Fixed tags inserted after class_tags (after taxonomy-derived "no humans").
  fixed_tags: ["animal focus"]
  order:                       # category order in the final caption
    - trigger
    - class
    - fixed
    - composition
    - view
    - pose
    - action
    - expression
    - gaze
    - appearance
    - accessories
    - objects
    - environment
    - setting
    - background
    - lighting
    - meta
    - other
  max_tags: 24
  vocabulary: null             # optional extra vocabulary yaml (merged over the built-in one)

# Classification taxonomy. Each dimension is enum (one value) or bool.
# For enum values, `tag` (optional) is the caption tag emitted for that value.
# For bools, `tag_true` / `tag_false` (optional) are emitted for that answer.
# `category` (optional) places the emitted tag in a caption.order slot
# (default: the dimension name if it is in caption.order, else "other").
taxonomy:
  composition:
    description: "how much of the subject is in frame"
    values:
      face_closeup: {tag: "close-up", description: "head/face fills the frame"}
      upper_body: {tag: "upper body", description: "head and front part of the body"}
      full_body: {tag: "full body", description: "whole body visible"}
      environmental: {tag: "wide shot", description: "subject small within a larger scene"}
  view:
    description: "camera position relative to the subject's body"
    values:
      front: {tag: "facing viewer", description: "subject faces the camera"}
      three_quarter: {description: "between front and side"}
      side: {tag: "from side", description: "profile"}
      rear: {tag: "from behind", description: "camera behind the subject"}
      top_down: {tag: "from above", description: "camera looks down on the subject"}
      low_angle: {tag: "from below", description: "camera looks up at the subject"}
      other: {}
  pose:
    description: "main body pose"
    values:
      sitting: {tag: "sitting"}
      standing: {tag: "standing"}
      lying: {tag: "lying"}
      walking: {tag: "walking"}
      sleeping: {tag: "sleeping"}
      stretching: {tag: "stretching"}
      jumping: {tag: "jumping"}
      other: {}
  environment:
    values:
      indoors: {tag: "indoors"}
      outdoors: {tag: "outdoors"}
      unknown: {}
  face_visible: {type: bool, description: "the subject's face is visible"}
  eyes_open: {type: bool, description: "the subject's eyes are open", tag_false: "closed eyes", category: expression}
  tail_visible: {type: bool, description: "the subject's tail is visible"}
  partially_occluded: {type: bool, description: "part of the subject is hidden behind something or cut off"}
  humans_visible: {type: bool, description: "any person or human body part (e.g. a hand) is visible", tag_false: "no humans", category: fixed}

model:
  name: qwen3.5-4b             # see `wlora models`
  max_pixels: 1048576          # images are downscaled (aspect kept) to at most this many pixels
  max_new_tokens: 600
  temperature: 0               # 0 = greedy (reproducible)

ingest:
  mode: move                   # move | copy  (HEIC and camera raws are always converted to JPEG)
  jpeg_quality: 95
  raw:                         # CR3, CR2, NEF, ARW, DNG, RAF, ...
    source: embedded           # embedded (camera-rendered full-size preview) | develop (LibRaw demosaic)

train:                         # `wlora train`, see docs/plans/lora-tuning.md
  sd_scripts: ~/Codebase/sd-scripts                    # kohya sd-scripts checkout with its own .venv
  base_model: ~/Codebase/ComfyUI/models/checkpoints/waiIllustriousSDXL_v170.safetensors
  comfyui: http://127.0.0.1:8188                       # asked to unload its models before training
  comfyui_loras: ~/Codebase/ComfyUI/models/loras       # run outputs are linked in as wlora/<dataset>/<run>; null = off
  params:                      # defaults; override per run with `--set key=value`
    resolution: 1024           # buckets from resolution/2 to resolution*2
    max_pixels: 2097152        # training copies are downscaled to at most this many pixels
    network_dim: 16
    network_alpha: 8
    learning_rate: 1.0e-4
    optimizer: AdamW8bit
    lr_scheduler: cosine
    lr_warmup_ratio: 0.05
    batch_size: 2
    epochs: 16
    save_every_n_epochs: 2
    num_repeats: 1
    min_snr_gamma: 5
    noise_offset: 0
    flip_aug: false            # off: markings are asymmetric
    # Added after trigger + class tags; they absorb the photo look so the trigger doesn't.
    style_tags: ["photo (medium)", "realistic"]
    # Added after the style tags to images whose eyes are open and visible (from the
    # classification), and to every eval prompt; e.g. ["orange eyes"] when the base
    # model's default eye colour wins over the trigger word.
    eye_tags: []
    # Either one turns off text-encoder output caching (slower, more VRAM).
    shuffle_caption: false
    keep_tokens: 2             # with shuffle_caption: tags kept in front (trigger, class)
    caption_dropout_rate: 0
    seed: 42
  eval:                        # `wlora eval`: fixed prompts/seeds rendered for every checkpoint × strength
    comfyui_output: ~/Codebase/ComfyUI/output     # images land in wlora/<dataset>/<run>/
    workflow: null             # default: <repo>/comfyui/workflows/wai-illustrious-lora.api.json
    strengths: [0.6, 0.8, 1.0]
    seeds: [1]
    size: [832, 1216]
    steps: 28
    cfg: 5
    quality_tags: "masterpiece, best quality, amazing quality"
    negative_prompt: "photo (medium), realistic, photorealistic, 3d, worst quality, low quality, lowres, bad anatomy, jpeg artifacts, watermark, signature, text"
    # {trigger} is replaced by the trigger word; each prompt is also rendered without
    # it (without_trigger: false to skip) to see how much the LoRA leaks into normal prompts.
    prompts:
      - {id: home, prompt: "{trigger}, cat, no humans, animal focus, full body, sitting, windowsill, indoors, sunlight"}
      - {id: closeup, prompt: "{trigger}, cat, no humans, animal focus, close-up, looking at viewer"}
      - {id: forest, prompt: "{trigger}, cat, no humans, animal focus, full body, walking, fantasy forest, glowing mushrooms, night"}
      - {id: scarf, prompt: "{trigger}, cat, no humans, animal focus, upper body, red scarf, snow, outdoors"}
      - {id: chibi, prompt: "{trigger}, cat, chibi, no humans, white background"}

paths:
  images: images
  exports: exports
  state: .wlora
  train: train
