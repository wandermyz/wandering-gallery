# wandering-gallery configuration.
# Copy to ~/.config/wandering-gallery/config.yaml and edit.
# Relative paths are resolved against this file's directory; ~ is expanded.

server:
  host: 127.0.0.1        # keep on localhost; expose with Tailscale Serve
  port: 2334
  # Extra Host header values allowed to reach the app (localhost is always allowed).
  # Add your tailnet hostname, e.g. my-pc.tailnet-name.ts.net
  allowedHosts: []

# SQLite database and trash live here (default: ~/.local/share/wandering-gallery).
# dataDir: ~/.local/share/wandering-gallery
# Thumbnails/previews; safe to delete at any time (default: ~/.cache/wandering-gallery).
# cacheDir: ~/.cache/wandering-gallery

libraries:
  - id: comfyui            # unique, lowercase letters/digits/-/_
    name: ComfyUI Outputs
    path: /path/to/ComfyUI/output
    recursive: true        # include subfolders
    writable: true         # allow moving files to the trash and editing caption sidecars

  - id: inputs
    name: ComfyUI Inputs
    path: /path/to/ComfyUI/input
    recursive: true
    writable: false
    showInAll: false       # keep out of "All media" and "Favorites" (default true)
    # hidden: true         # only listed (and its files only served) while unlocked;
    #                      # needs hidden.passphraseHash below

  # Folders on removable/mounted disks are fine: while unmounted the library shows as
  # unavailable and keeps its index, ratings and favorites; it is picked up again
  # within a minute of being mounted.

scan:
  stableSeconds: 5         # a file must be unchanged this long before indexing/deleting
  intervalMinutes: 60      # periodic safety-net rescan (file watching handles normal changes)
  usePolling: false        # set true for network filesystems where inotify does not work

trash:
  retentionDays: 7         # trashed files are permanently deleted after this many days

# Generate section (ComfyUI via comfy-cli). All optional; see the README.
# generate:
#   comfyui: http://127.0.0.1:8188   # ComfyUI server
#   comfyCli: comfy-cli              # comfy-cli executable
#   tagger: danbooru-tagger          # description -> Danbooru tags (local LLM)
#   gpuWorkload: gpu-workload        # run `switch comfy` before ComfyUI jobs; false to skip
#   outputLibrary: comfyui           # library that holds ComfyUI's output folder
#   inputLibrary: comfyui-input      # library that holds ComfyUI's input folder
#   promptsDir: ~/.config/wandering-gallery/prompts   # local prompt texts, never in git
#   # One "prompt to tags" flow per LoRA (e.g. from `wlora train` in lora/). It shares the
#   # prompts file of wai-illustrious-tags; <promptsDir>/wai-illustrious-lora-<id>.yaml can
#   # override any of its keys.
#   loras:
#     - id: siggraph
#       title: Siggraph LoRA
#       lora: siggraph.safetensors        # as ComfyUI lists it under models/loras
#       strength: 1.0
#       tags: siggraph, cat               # prefilled after the quality tags
#       negative: photo (medium), realistic, text, signature, watermark   # appended
#       dropTags: [1girl, 1boy, 2girls, 2boys, multiple girls, multiple boys]   # removed from generated tags

# Hidden items (eye button in the viewer). Without a passphrase, hiding is off.
# hidden:
#   passphraseHash: scrypt:...   # output of `npm run hash-passphrase`
#   unlockMinutes: 15            # how long an unlock lasts in a browser

thumbnails:
  size: 360
  quality: 78

tools:
  ffmpeg: ffmpeg           # used for video thumbnails
  ffprobe: ffprobe         # used for video metadata
